# Defaults for every project in this repository.
# A project overrides any of these in projects/<slug>/config.yaml.
# Steps must read these only through the accessors in src/utils/ — never by parsing the file.
schema_version: 1

paths:
  results: results
  tables: results/tables
  figures: results/figures
  reports: results/reports
  logs: logs
  scratch: scratch

run:
  seed: 1                    # set once; record it in every output
  threads: 1                 # raise deliberately, and note any shared-host budget
  dry_run: false

# Assertions that run before expensive or irreversible steps. Set enabled: false
# only to debug, and never in a run whose results you intend to use.
quality:
  enabled: true

# How the assistant should behave when a parameter could be chosen automatically.
#   auto_tune — choose it, record the choice and the reason
#   ask       — stop and ask the researcher
decisions:
  default_mode: ask

# Evidence tier for any parameter you record, so a single study's number is never
# copied as if it were a law. One of: benchmarked consensus single_study inferred
evidence:
  default_tier: inferred
  require_tier: true
